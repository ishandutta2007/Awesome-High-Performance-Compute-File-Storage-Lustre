<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .metric-val { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 24px; fill: #f8fafc; }
    .metric-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
    
    /* Subtle SVG Animations */
    @keyframes pulseCircle {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    
    .animated-pulse { animation: pulseCircle 6s ease-in-out infinite; transform-origin: 950px 200px; }
    .animated-float-1 { animation: floatCard 5s ease-in-out infinite; }
    .animated-float-2 { animation: floatCard 6s ease-in-out infinite 1s; }
    .data-stream { stroke-dasharray: 20, 10; animation: dashStream 8s linear infinite; }
  </style>

  <!-- Base Layer: Solid Dark Grid -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Background Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400"/>
  </g>

  <!-- Dynamic / Animated Background Glow Elements (Behind Text) -->
  <circle class="animated-pulse" cx="950" cy="200" r="180" fill="url(#cyan-glow)" />

  <!-- Animated Data Flow Rays -->
  <g stroke="url(#primary-glow)" stroke-width="2" fill="none" opacity="0.6">
    <path class="data-stream" d="M 650 350 Q 800 250 1150 280"/>
    <path class="data-stream" d="M 700 80 Q 900 150 1180 100"/>
  </g>

  <!-- Decorative Dynamic Metric Cards (Right Side Layout) -->
  <g class="animated-float-1" transform="translate(720, 90)">
    <rect width="210" height="90" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="18" width="8" height="54" rx="4" fill="#3b82f6"/>
    <text x="35" y="42" class="metric-val">100+ GB/s</text>
    <text x="35" y="62" class="metric-lbl">Parallel Throughput</text>
  </g>

  <g class="animated-float-2" transform="translate(950, 160)">
    <rect width="210" height="90" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="18" width="8" height="54" rx="4" fill="#10b981"/>
    <text x="35" y="42" class="metric-val">&lt;300 μs</text>
    <text x="35" y="62" class="metric-lbl">Ultra-Low Latency</text>
  </g>

  <g class="animated-float-1" transform="translate(780, 240)">
    <rect width="210" height="90" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="18" width="8" height="54" rx="4" fill="#8b5cf6"/>
    <text x="35" y="42" class="metric-val">Exascale</text>
    <text x="35" y="62" class="metric-lbl">Petabyte Data Storage</text>
  </g>

  <!-- Foreground Title and Subtitle Area (Left Aligned - Clean Unobstructed Layer) -->
  <g transform="translate(80, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 75)">
      <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" class="tag">⚡ HIGH-PERFORMANCE COMPUTE</text>
    </g>

    <!-- Main Repository Title -->
    <text x="0" y="165" class="title" filter="url(#glow)">Awesome High-Performance</text>
    <text x="0" y="215" class="title" fill="url(#primary-glow)">Compute File Storage (Lustre)</text>

    <!-- Subtitle -->
    <text x="0" y="265" class="subtitle">Curated Parallel File Systems, Managed Cloud Lustre &amp; HPC Infrastructure</text>

    <!-- Decorative Bottom Accent Line -->
    <rect x="0" y="305" width="580" height="4" rx="2" fill="url(#primary-glow)"/>
  </g>
</svg>
